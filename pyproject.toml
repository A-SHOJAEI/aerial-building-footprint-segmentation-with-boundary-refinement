[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "building-segmentation"
version = "1.0.0"
description = "Aerial building footprint segmentation with U-Net++ and boundary refinement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "segmentation-models-pytorch>=0.3",
    "albumentations>=1.3",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
